name: Build Debug APK (for testing on your phone)

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Uses the Android SDK already installed on the runner; just accept licenses.
      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          LIC="$SDK/licenses"
          (mkdir -p "$LIC" || sudo mkdir -p "$LIC")
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' | (tee "$LIC/android-sdk-license" >/dev/null || sudo tee "$LIC/android-sdk-license" >/dev/null)
          echo "Licenses written to $LIC"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply app.config.json to legal pages
        run: node scripts/apply-config.js

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android project (icons, manifest, gradle)
        run: node scripts/patch-android.js

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shadowit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
