name: Publish Privacy Policy page (manual, optional)

# Gives you a public URL for the Google Play "Privacy policy" field:
#   https://YOUR-USERNAME.github.io/YOUR-REPO/privacy-policy.html
# One-time setup: Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Then run this workflow from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply app.config.json
        run: node scripts/apply-config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
